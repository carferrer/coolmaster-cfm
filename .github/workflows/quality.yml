name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github .
      - name: Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check .

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q
